name: Volo Calendar Sync

on:
  schedule:
    - cron: "7-59/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without writing to Google Calendar"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: volo-calendar-sync
  cancel-in-progress: false

jobs:
  sync-calendar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/calendar

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependency
        run: npm install --no-audit --no-fund

      - name: Locate Chrome
        run: echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Sync registered pickup sessions
        env:
          VOLO_EMAIL: ${{ secrets.VOLO_EMAIL }}
          VOLO_PASSWORD: ${{ secrets.VOLO_PASSWORD }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          node patch-calendar-sync-sport-durations.mjs
          node patch-calendar-sync-safe-deletion.mjs
          node --check volo-calendar-sync.mjs
          node volo-calendar-sync.mjs

      - name: Sync registered soccer games
        env:
          VOLO_EMAIL: ${{ secrets.VOLO_EMAIL }}
          VOLO_PASSWORD: ${{ secrets.VOLO_PASSWORD }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          node patch-calendar-soccer-safe-deletion.mjs
          node --check volo-calendar-soccer-sync.mjs
          node volo-calendar-soccer-sync.mjs
