name: Volo Drop-In Monitor

on:
  schedule:
    # GitHub's minimum supported interval is five minutes.
    # Starting at minute 2 avoids the busiest top-of-hour scheduling period.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      calendar_sync_test:
        description: "Test Volo dashboard login and Google Calendar access"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: volo-sports-monitor
  cancel-in-progress: false

jobs:
  check-volo:
    runs-on: ubuntu-24.04
    # The monitor itself retries transient Volo/browser failures up to three times.
    # Give those retries enough room to finish instead of killing a recovering run.
    timeout-minutes: 20

    env:
      # Do not use minimumMen=1 here. Volo treats "Men" and "Any gender" as
      # separate inventory, even though a man can register for either one.
      # The monitor verifies gender eligibility on each game's details page.
      VOLO_URL: https://www.volosports.com/discover/denver?category=daily-sports&programType=dropin&sports=soccer
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        if: github.event_name == 'workflow_dispatch' && inputs.calendar_sync_test
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/calendar

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install monitor dependency
        run: npm install --no-audit --no-fund

      - name: Locate Chrome
        run: echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Increase browser protocol timeout
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'monitor.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const marker = '  const browser = await puppeteer.launch({\n    executablePath: CHROME_PATH,';
          const replacement = '  const browser = await puppeteer.launch({\n    executablePath: CHROME_PATH,\n    protocolTimeout: 300_000,';
          if (!source.includes('protocolTimeout: 300_000')) {
            if (!source.includes(marker)) throw new Error('Could not locate Puppeteer browser launch.');
            source = source.replace(marker, replacement);
            fs.writeFileSync(path, source);
          }
          NODE
          node --check monitor.mjs

      - name: Check Volo and send alerts
        id: monitor
        continue-on-error: true
        run: npm run monitor

      - name: Test Volo dashboard and Google Calendar access
        if: github.event_name == 'workflow_dispatch' && inputs.calendar_sync_test
        env:
          VOLO_EMAIL: ${{ secrets.VOLO_EMAIL }}
          VOLO_PASSWORD: ${{ secrets.VOLO_PASSWORD }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node volo-calendar-dashboard-card-diagnostic.mjs

      - name: Persist current listing state
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- state.json; then
            echo "No state change to commit."
            exit 0
          fi

          # Keep the state produced by this run, but always build the commit on top
          # of the newest master. Scheduled runs can otherwise push from a stale
          # checkout and fail with a non-fast-forward error.
          cp state.json /tmp/volo-state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Persist state attempt ${attempt}/3"
            git fetch origin master
            git reset --hard origin/master
            cp /tmp/volo-state.json state.json

            git add state.json
            if git diff --cached --quiet; then
              echo "Latest master already contains this state."
              exit 0
            fi

            git commit -m "chore: update Volo monitor state [skip ci]"
            if git push origin HEAD:master; then
              echo "Volo monitor state persisted successfully."
              exit 0
            fi

            echo "State push raced with another master update; retrying on latest master."
          done

          echo "Unable to persist Volo monitor state after 3 attempts." >&2
          exit 1

      - name: Mark workflow failed when monitor failed
        if: steps.monitor.outcome == 'failure'
        run: exit 1
