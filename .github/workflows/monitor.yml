name: Volo Drop-In Monitor

on:
  schedule:
    # GitHub's minimum supported interval is five minutes.
    # Starting at minute 2 avoids the busiest top-of-hour scheduling period.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      pickleball_test:
        description: "Send a pickleball diagnostic notification"
        required: false
        default: false
        type: boolean
      calendar_sync_test:
        description: "Test Volo dashboard login and Google Calendar access"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: volo-sports-monitor
  cancel-in-progress: false

jobs:
  check-volo:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    env:
      # Do not use minimumMen=1 here. Volo treats "Men" and "Any gender" as
      # separate inventory, even though a man can register for either one.
      # The monitor verifies gender eligibility on each game's details page.
      VOLO_URL: https://www.volosports.com/discover/denver?category=daily-sports&programType=dropin&sports=soccer
      PICKLEBALL_URL: https://www.volosports.com/discover/denver?category=daily-sports&programType=pickups&sports=pickleball&venues=club-volo-sobo-indoor
      PICKLEBALL_TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.pickleball_test || false }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        if: github.event_name == 'workflow_dispatch' && inputs.calendar_sync_test
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/calendar

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install monitor dependency
        run: npm install --no-audit --no-fund

      - name: Locate Chrome
        run: echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Apply strict SoBo pickleball filter
        run: |
          node patch-pickleball-strict-sobo.mjs
          node --check pickleball-monitor.mjs

      - name: Check Volo and send alerts
        id: monitor
        continue-on-error: true
        run: npm run monitor

      - name: Test Volo dashboard and Google Calendar access
        if: github.event_name == 'workflow_dispatch' && inputs.calendar_sync_test
        env:
          VOLO_EMAIL: ${{ secrets.VOLO_EMAIL }}
          VOLO_PASSWORD: ${{ secrets.VOLO_PASSWORD }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node volo-calendar-dashboard-card-diagnostic.mjs

      - name: Persist current listing state
        if: always()
        shell: bash
        run: |
          if ! git diff --quiet -- state.json pickleball-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json pickleball-state.json
            git commit -m "chore: update Volo monitor state [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi

      - name: Mark workflow failed when monitor failed
        if: steps.monitor.outcome == 'failure'
        run: exit 1
